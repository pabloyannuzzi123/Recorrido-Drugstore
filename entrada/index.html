<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Marcar entrada – Drugstore</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  :root { --azul:#1f3a5f; --verde:#1e8e3e; --rojo:#c5221f; --gris:#f2f4f7; --borde:#d9dde3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--gris); color:#1b1f24; }
  header { background:var(--azul); color:#fff; padding:18px 16px 14px; text-align:center; }
  header small { opacity:.75; letter-spacing:.08em; text-transform:uppercase; font-size:12px; }
  header h1 { margin:4px 0 0; font-size:24px; }
  main { max-width:460px; margin:0 auto; padding:16px; }
  .reloj { text-align:center; font-size:46px; font-weight:700; font-variant-numeric:tabular-nums; margin:8px 0 2px; }
  .fecha { text-align:center; color:#5b6470; margin-bottom:18px; text-transform:capitalize; }
  .card { background:#fff; border:1px solid var(--borde); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-weight:600; margin-bottom:8px; }
  select, input { width:100%; font-size:17px; padding:12px; border:1px solid var(--borde); border-radius:10px; background:#fff; }
  .turnos { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .turnos button { padding:14px 4px; font-size:16px; border:1px solid var(--borde); background:#fff; border-radius:10px; font-weight:600; }
  .turnos button.sel { background:var(--azul); color:#fff; border-color:var(--azul); }
  .btn { width:100%; padding:17px; font-size:18px; font-weight:700; border:0; border-radius:12px; background:var(--verde); color:#fff; }
  .btn:disabled { opacity:.5; }
  .btn.sec { background:#25d366; margin-top:10px; }
  .btn.gris { background:#5b6470; margin-top:10px; }
  .res { text-align:center; padding:22px 16px; border-radius:14px; color:#fff; margin-bottom:14px; }
  .res.ok { background:var(--verde); } .res.tarde { background:var(--rojo); }
  .res .grande { font-size:40px; font-weight:800; margin:6px 0; }
  .aviso { background:#fff4cc; border:1px solid #f0d66b; padding:12px; border-radius:10px; font-size:14px; margin-bottom:14px; }
  .error { background:#fde2e1; border:1px solid #f3b3ae; color:#8c1d18; padding:12px; border-radius:10px; margin-bottom:14px; }
  .oculto { display:none; }
  .qrs { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
  .qr { background:#fff; border:2px solid #000; border-radius:12px; padding:14px; text-align:center; page-break-inside:avoid; }
  .qr h2 { margin:0 0 4px; font-size:22px; } .qr p { margin:6px 0 0; font-size:13px; }
  .qr svg { width:100%; height:auto; }
  @media print { header, .noprint { display:none !important; } body { background:#fff; } main { max-width:none; } }
</style>
</head>
<body>
<header><small>Drugstore · Marcar entrada</small><h1 id="titulo">—</h1></header>
<main id="app"></main>

<script>
/* ============ CONFIGURACIÓN ============ */
// Pegá acá la URL de la aplicación web de Apps Script (termina en /exec)
const API_URL = 'PEGAR_URL_DE_APPS_SCRIPT';
// La lista de empleados sale de la pestaña "Empleados" de la planilla.
/* ====================================== */

const $ = s => document.querySelector(s);
const app = $('#app');
const params = new URLSearchParams(location.search);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const leer = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

async function api(datos) {
  const url = API_URL + '?' + new URLSearchParams(datos).toString();
  const r = await fetch(url, { redirect: 'follow' });
  return r.json();
}

/* ---------- Pantalla del empleado ---------- */
function pantallaEmpleado(local, k) {
  $('#titulo').textContent = local;
  const h = new Date().getHours();
  let turno = h >= 4 && h < 11 ? 'manana' : (h >= 11 && h < 18 ? 'tarde' : 'noche');
  const ultimo = leer('empleado') || '';

  app.innerHTML = `
    <div class="reloj" id="reloj">--:--</div>
    <div class="fecha" id="fecha"></div>
    <div id="msg"></div>
    <div id="form">
      <div class="card">
        <label for="emp">¿Quién sos?</label>
        <select id="emp" disabled><option value="">Cargando nombres…</option></select>
      </div>
      <div class="card">
        <label>Turno</label>
        <div class="turnos">
          <button data-t="manana">Mañana</button><button data-t="tarde">Tarde</button><button data-t="noche">Noche</button>
        </div>
      </div>
      <button class="btn" id="marcar">Marcar entrada</button>
    </div>`;

  const marcarTurno = t => { turno = t; document.querySelectorAll('.turnos button').forEach(b => b.classList.toggle('sel', b.dataset.t === t)); };
  document.querySelectorAll('.turnos button').forEach(b => b.onclick = () => marcarTurno(b.dataset.t));
  marcarTurno(turno);

  const tic = () => {
    const d = new Date();
    $('#reloj').textContent = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    $('#fecha').textContent = d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
  };
  tic(); setInterval(tic, 1000);

  const cargarNombres = async () => {
    const sel = $('#emp');
    try {
      const r = await api({ accion: 'empleados', local, k });
      if (!r.ok) throw new Error(r.error || 'Error');
      sel.innerHTML = '<option value="">Elegí tu nombre</option>' +
        r.empleados.map(n => `<option ${n === ultimo ? 'selected' : ''}>${esc(n)}</option>`).join('');
      sel.disabled = false;
    } catch (e) {
      sel.innerHTML = '<option value="">No se pudo cargar la lista</option>';
      $('#msg').innerHTML = `<div class="error">No se pudo cargar la lista de nombres (${esc(e.message || e)}). Revisá la conexión y recargá la página.</div>`;
    }
  };
  cargarNombres();

  $('#marcar').onclick = async () => {
    const empleado = $('#emp').value;
    const msg = $('#msg');
    msg.innerHTML = '';
    if (!empleado) { msg.innerHTML = '<div class="error">Elegí tu nombre.</div>'; return; }
    guardar('empleado', empleado);
    const btn = $('#marcar');
    btn.disabled = true; btn.textContent = 'Obteniendo ubicación…';
    const pos = await ubicacion();
    btn.textContent = 'Registrando…';
    try {
      const datos = { accion: 'marcar', local, k, empleado, turno };
      if (pos) { datos.lat = pos.lat; datos.lng = pos.lng; }
      const r = await api(datos);
      if (!r.ok) throw new Error(r.error || 'No se pudo registrar');
      mostrarResultado(r, !pos);
    } catch (e) {
      msg.innerHTML = `<div class="error">${esc(e.message || e)}<br>Probá de nuevo. Si sigue fallando, avisá a tu encargada.</div>`;
      btn.disabled = false; btn.textContent = 'Marcar entrada';
    }
  };
}

function ubicacion() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude.toFixed(6), lng: p.coords.longitude.toFixed(6) }),
      () => res(null),
      { enableHighAccuracy: true, timeout: 9000, maximumAge: 0 }
    );
  });
}

function mostrarResultado(r, sinUbic) {
  const tarde = r.estado === 'Tarde';
  $('#form').classList.add('oculto');
  $('#msg').innerHTML = `
    ${r.repetido ? '<div class="aviso">Ya tenías la entrada marcada en este turno. Queda la primera.</div>' : ''}
    ${sinUbic ? '<div class="aviso">No se pudo tomar la ubicación. Activá la ubicación del celular para la próxima.</div>' : ''}
    <div class="res ${tarde ? 'tarde' : 'ok'}">
      <div>${esc(r.empleado)} · Turno ${esc(r.turno)}</div>
      <div class="grande">${esc(r.hora)}</div>
      <div>${tarde ? `Llegaste ${r.minTarde} min tarde (entrada ${esc(r.esperado)})` : '¡A tiempo! ✔'}</div>
    </div>`;
}

/* ---------- Pantalla para imprimir QR ---------- */
function pantallaAdmin() {
  $('#titulo').textContent = 'QR de los locales';
  app.innerHTML = `
    <div class="card noprint">
      <label for="clave">Clave de administrador</label>
      <input id="clave" type="password" placeholder="Clave">
      <button class="btn" id="ver" style="margin-top:12px">Ver QR</button>
      <div id="err"></div>
    </div>
    <div class="qrs" id="qrs"></div>`;
  $('#ver').onclick = async () => {
    $('#err').innerHTML = '';
    try {
      const r = await api({ accion: 'qr', clave: $('#clave').value });
      if (!r.ok) throw new Error(r.error);
      const base = location.origin + location.pathname;
      $('#qrs').innerHTML = r.locales.map(x => {
        const url = base + '?local=' + encodeURIComponent(x.local) + '&k=' + encodeURIComponent(x.k);
        const q = qrcode(0, 'M'); q.addData(url); q.make();
        return `<div class="qr"><h2>${esc(x.local)}</h2>${q.createSvgTag({ cellSize: 6, margin: 2, scalable: true })}
                <p><b>Escaneá al llegar para marcar tu entrada</b></p></div>`;
      }).join('');
      $('#qrs').insertAdjacentHTML('beforebegin', '<button class="btn gris noprint" onclick="print()" style="margin-bottom:14px">Imprimir</button>');
    } catch (e) { $('#err').innerHTML = `<div class="error" style="margin-top:12px">${esc(e.message || e)}</div>`; }
  };
}

/* ---------- Inicio ---------- */
if (API_URL.startsWith('PEGAR')) {
  $('#titulo').textContent = 'Falta configurar';
  app.innerHTML = '<div class="error">Pegá la URL de Apps Script en API_URL dentro de este archivo.</div>';
} else if (params.has('admin')) {
  pantallaAdmin();
} else if (params.get('local') && params.get('k')) {
  pantallaEmpleado(params.get('local'), params.get('k'));
} else {
  $('#titulo').textContent = 'Drugstore';
  app.innerHTML = '<div class="card" style="text-align:center">Escaneá el QR pegado en el local para marcar tu entrada.</div>';
}
</script>
</body>
</html>
